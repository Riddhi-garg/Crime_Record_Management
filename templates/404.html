{% extends "base.html" %}

{% block title %}404 Page Not Found - CRMS{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle-fill text-warning display-1"></i>
    <h1 class="display-4 font-weight-bold text-dark mt-3">404 - Page Not Found</h1>
    <p class="lead text-muted">The record file or page you are requesting could not be located in the CRMS database.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary fw-bold px-4 py-2 mt-3">
        <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
