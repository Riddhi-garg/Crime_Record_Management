{% extends "base.html" %}

{% block title %}403 Access Forbidden - CRMS{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-shield-x text-danger display-1"></i>
    <h1 class="display-4 font-weight-bold text-dark mt-3">403 - Access Denied</h1>
    <p class="lead text-muted">You do not have the required role privileges (Admin) to access this administrative module.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary fw-bold px-4 py-2 mt-3">
        <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
