{% extends "base.html" %}

{% block title %}500 Internal Server Error - CRMS{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-cpu-fill text-danger display-1"></i>
    <h1 class="display-4 font-weight-bold text-dark mt-3">500 - Internal Server Error</h1>
    <p class="lead text-muted">The CRMS application encountered an unexpected database query error or system exception.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary fw-bold px-4 py-2 mt-3">
        <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
